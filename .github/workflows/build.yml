name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/obsidian-notes-widget.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-notes-widget
          path: app/build/outputs/apk/debug/obsidian-notes-widget.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/obsidian-notes-widget.apk
          name: Initial Release
          body: |
            First public release of Obsidian Notes Widget.

            ## Installation

            1. Download `obsidian-notes-widget.apk` below
            2. On your Android device, enable **Install unknown apps** for your browser or file manager
            3. Open the downloaded APK to install

            > **Note:** This is a debug build. Android will warn you about installing from unknown sources — this is expected for apps not distributed via the Play Store.
